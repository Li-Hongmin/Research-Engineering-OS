# 第九章「不爆炸的科学」分镜脚本
chapter: "09-no-boom"
title_zh: "不爆炸的科学"
title_en: "No-Boom Science"

panels:
  - id: "09_001"
    description_zh: "又是一个deadline的前夜。小研已经学会了这么多——清晰的代码结构、完整的Git历史、详细的日志...她本来信心满满地按下最后一次运行。但就在此刻，屏幕闪烁，程序...崩溃了。一条致命错误刺眼地显示在屏幕上。小研的手僵在键盘上。不...不是现在。还有这种问题？"
  - id: "09_002"
    description_zh: "'为什么总是这样！'小研一拳砸在桌上。这是第三次了。前两次也是到了关键时刻就崩溃。她擦了擦眼睛，强迫自己去看那条错误信息。'代码肯定有问题。但什么问题？什么时候埋的这个雷？'她的脑子开始飞速转动，试图回溯。"
  - id: "09_003"
    description_zh: "导师端着咖啡走了进来。看了一眼屏幕上的崩溃信息，导师平静地说：'这次的问题不在于代码写得不好，而在于你没有防守。防御性编程就是这样——不要相信任何东西。不要相信输入是对的，不要相信中间结果是对的，不要相信外部资源是存在的。'小研抬起头，眼中闪过一丝明白。"
  - id: "09_004"
    description_zh: "第一原则：永远验证输入数据。"
  - id: "09_005"
    description_zh: "添加断言检查：确保数据符合预期。"
  - id: "09_006"
    description_zh: "实现优雅降级：部分失败不应导致全盘崩溃。"
  - id: "09_007"
    description_zh: "使用异常处理：明确每个可能的失败点。"
  - id: "09_008"
    description_zh: "添加类型检查：在运行前发现类型错误。"
  - id: "09_009"
    description_zh: "实现检查点机制：可以从中间恢复，不必从头开始。"
  - id: "09_010"
    description_zh: "使用配置验证：启动前检查所有配置是否合法。"
  - id: "09_011"
    description_zh: "添加smoke test：部署前的快速健康检查。"
  - id: "09_012"
    description_zh: "实现资源限制：防止内存泄漏和无限循环。"
  - id: "09_013"
    description_zh: "使用超时机制：避免永远等待。"
  - id: "09_014"
    description_zh: "添加进度监控：实时了解执行状态。"
  - id: "09_015"
    description_zh: "实现回滚机制：出错时能够安全恢复。"
  - id: "09_016"
    description_zh: "使用幂等操作：重复执行不会造成副作用。"
  - id: "09_017"
    description_zh: "添加依赖检查：启动前验证所有依赖可用。"
  - id: "09_018"
    description_zh: "实现金丝雀测试：小规模验证再全面部署。"
  - id: "09_019"
    description_zh: "建立部署清单：上线前的检查列表。"
  - id: "09_020"
    description_zh: "三个月后的deadline前夜，小研的代码稳定运行。"
  - id: "09_021"
    description_zh: "她平静地提前两天提交了论文。"
  - id: "09_022"
    description_zh: "导师微笑：'这就是工程思维的力量。'"
  - id: "09_023"
    description_zh: "小研的经验分享：'预防胜于治疗。'"
  - id: "09_024"
    description_zh: "实验室采用了小研的防御性编程checklist。"
  - id: "09_025"
    description_zh: "结尾：小研的格言：'代码会失败，但我们可以优雅地处理失败。'"
