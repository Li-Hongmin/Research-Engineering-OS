# 第六章「记录的艺术」分镜脚本
chapter: "06-logging"
title_zh: "记录的艺术"
title_en: "The Art of Logging"

panels:
  - id: "06_001"
    description_zh: "掌握了前面的技巧后，小研的项目逐渐步入了正轨。代码结构清晰了，Git历史清楚了，每一步都有检查表。她觉得自己终于走出了困境。但这天，一个诡异的bug出现了。程序说完成了某个步骤，可数据为什么还是错的？她打开终端，想从日志里找答案。却被满屏的混乱输出淹没了。好不容易找到一条相关的信息...她也看不懂。她面对着自己生成的日志，竟然一脸茫然。"
  - id: "06_002"
    description_zh: "小研转身看着过去三个月的代码。到处都是print语句。'print(data)'、'print(\"here\")'、'print(result)'...当时为了快速调试，她一边写一边加这些语句。当时觉得没什么，反正能看到输出就行了。但现在，这成了一场灾难。每次程序运行，屏幕上都是一片混乱。她需要的信息在哪里？谁知道。"
  - id: "06_003"
    description_zh: "数千行日志混淆在一起。有些是调试信息，有些是中间结果，有些是无意义的'here'，有些根本不知道什么时候被打印的。小研盯着屏幕，眼睛不断往下滚，却找不到她需要的那一条日志。她的头开始疼，感到一阵无力感。需要的信息就像埋在沙子里的针，而沙子无限多。"
  - id: "06_004"
    description_zh: "又一次，她找导师求助。导师看了一眼日志，然后打开了一个结构化日志的例子。'看看这个。'导师说。每一条日志都清楚地标注了级别（DEBUG、INFO、WARNING、ERROR）、时间戳、模块名、上下文信息。不同的信息用不同的颜色高亮。整个日志文件就像一本清晰的账本，而不是一堆垃圾。"
  - id: "06_005"
    description_zh: "导师给了她一个logging框架的模板。小研开始动手，替换掉那些混乱的print语句。这次，她用了一个正式的logging模块。'这太复杂了吧？'她一开始这样想。但导师只是微笑，'一开始复杂，但长期来看，这会拯救你。'"
  - id: "06_006"
    description_zh: "小研为日志定义了五个级别：DEBUG（最详细的调试信息）、INFO（重要的业务流程）、WARNING（警告，但还在继续）、ERROR（出错了）、CRITICAL（致命错误）。不同的级别用不同的图标和颜色，就像交通信号灯一样——一眼就看明白了。"
  - id: "06_007"
    description_zh: "为每个实验运行赋予一个唯一的ID，就像给每个病人一个号码。这样，当她后来要追踪某个具体的实验经历了什么时，可以直接搜索这个ID，获得它的整条日志链。所有的信息都串联在一起，像一条清晰的故事线。"
  - id: "06_008"
    description_zh: "她开始在关键的决策点记录日志。'进入数据加载阶段'、'数据加载完成，共X条记录'、'开始训练，初始化参数'、'完成一个epoch，当前损失值为'、'检测到明显过拟合，提前停止训练'。这些日志不仅帮她调试，也让整个过程透明化了。"
  - id: "06_009"
    description_zh: "'日志不仅要记，还要分类输出。'导师指导。重要的INFO级别输出到控制台，让她实时看到进度。详细的DEBUG级别只保存到文件，保持清洁的终端界面。ERROR和CRITICAL日志同时输出到屏幕和日志文件，确保不遗漏。"
  - id: "06_010"
    description_zh: "小研还加入了性能监控日志。每个主要步骤完成时，她都记录一下耗时。'加载数据耗时3秒'、'一个epoch耗时45秒'。这样，她不仅知道程序运行了什么，还知道时间都花在哪里了。"
  - id: "06_011"
    description_zh: "导师建议她使用结构化日志格式——JSON。这样，计算机能更容易地解析这些日志，统计分析也方便了。不是纯文本的'something happened'，而是JSON格式的{'timestamp': '2024-01-15T10:30:45', 'level': 'INFO', 'module': 'data_loader', 'message': '加载完成', 'records': 1024}。"
  - id: "06_012"
    description_zh: "集成异常追踪。当程序出错时，logging框架自动捕获整个堆栈轨迹和错误时的上下文变量。不是一个空白的'Error!'，而是完整的'什么时刻、在哪个函数里、调用了什么参数、错误是什么'的信息。"
  - id: "06_013"
    description_zh: "实现日志轮转。之前小研的日志文件有时候会无限增长，最后占满硬盘。现在她设置了规则：每个日志文件最多保存5MB，超过就自动压缩和备份。这样既保持了历史记录，也不会浪费空间。"
  - id: "06_014"
    description_zh: "添加敏感信息过滤。有时日志里会包含用户数据或API密钥，不能直接保存。小研配置了一个过滤器，自动识别和脱敏这些信息，保证了隐私和安全。"
  - id: "06_015"
    description_zh: "小研还写了一个日志分析脚本。它能快速统计：今天有多少WARNING？哪个模块出错最多？哪些操作最耗时？一条命令就能生成可视化图表。这样，她不仅能解决当前的bug，还能从日志里发现趋势和优化机会。"
  - id: "06_016"
    description_zh: "最后，她设置了告警规则。当出现ERROR或CRITICAL时，系统自动发送通知。这样，即使她不在看屏幕，也不会错过关键的失败信息。前置的预警，比后置的救火要聪明得多。"
  - id: "06_017"
    description_zh: "三个月后，一个并发问题困扰了小研一整天。多个进程竞争一个资源，导致结果不稳定。她打开日志分析工具，按实验ID搜索，立刻就看到了哪个进程在哪个时刻获得了资源，哪个进程被卡住了，它们的顺序如何。五分钟内，问题原因浮出水面。她突然明白，一个好的日志系统，就像给代码装上了监控摄像头。"
  - id: "06_018"
    description_zh: "导师见她轻松地解决了这个问题，欣慰地点了点头。'好的日志系统，就是研究的第二双眼睛。'导师说，'通过日志，你能看见程序在做什么，能证明你的操作是正确的，也能快速找到问题所在。'"
  - id: "06_019"
    description_zh: "小研和新加入的学妹分享她的日志经验。'记录不仅仅是为了调试。'她说，'更是为了理解——理解你的程序在做什么、理解问题出在哪里。同时也是为了证明——证明你的流程是怎样的、你做了什么决策、结果是怎么得来的。一个没有日志的项目，就像一个没有任何痕迹的秘密，没人相信它。'"
  - id: "06_020"
    description_zh: "小研的工作笔记本里，已经积累了一句话，并把它写在了项目的README里：'Log everything that matters, nothing that doesn't. 记录一切重要的事，忽视那些无关紧要的。'这变成了她项目的座右铭，也逐渐成为了她新的习惯。"
