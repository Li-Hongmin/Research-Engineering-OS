name: Deploy Multi-language mdBook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Build Chinese version
        run: |
          cd mdbook
          mdbook build
          mkdir -p ../public
          cp -r book/html/* ../public/

      - name: Build English version
        run: |
          cd mdbook_english
          mdbook build
          mkdir -p ../public/en
          cp -r book/html/* ../public/en/

      - name: Create language selector page
        run: |
          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Research Engineering OS</title>
            <meta http-equiv="refresh" content="0; url=./zh/">
          </head>
          <body>
            <p>Redirecting to <a href="./zh/">Chinese version</a>...</p>
            <p>Or visit <a href="./en/">English version</a></p>
          </body>
          </html>
          EOF

          # 移动中文版到zh子目录
          mkdir -p public/zh
          mv public/*.html public/*.js public/*.css public/fonts public/images public/zh/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
