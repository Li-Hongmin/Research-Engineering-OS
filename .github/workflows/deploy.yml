name: Deploy mdBook to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Build multilingual text book
        run: |
          cd text-book
          chmod +x build_all.sh
          ./build_all.sh

      - name: Build manga edition
        run: |
          cd manga-book
          mdbook build

      - name: Combine outputs
        run: |
          # Move manga-book output to text-book/book/manga
          mkdir -p text-book/book/manga
          cp -r manga-book/book/* text-book/book/manga/

          # Create navigation index (optional enhancement)
          echo "✅ Combined text-book and manga-book into single deployment"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./text-book/book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
