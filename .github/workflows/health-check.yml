name: REOS Health Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run health check every day at 09:00 JST (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  health-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false
    
    - name: Setup mdBook
      uses: peaceiris/actions-mdbook@v2
      with:
        mdbook-version: 'latest'
    
    - name: Run REOS health check
      id: health-check
      run: |
        chmod +x check_health.sh
        ./check_health.sh
      continue-on-error: true
    
    - name: Run Markdown lint check
      id: markdown-lint
      run: |
        chmod +x check_markdown_lint.sh
        ./check_markdown_lint.sh
      continue-on-error: true
    
    - name: Upload health report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: health-report
        path: |
          check_health.sh
          check_markdown_lint.sh
        retention-days: 7
    
    - name: Comment health status on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const healthStatus = '${{ steps.health-check.outcome }}' === 'success' ? '✅ PASSED' : '⚠️ FAILED';
          const lintStatus = '${{ steps.markdown-lint.outcome }}' === 'success' ? '✅ PASSED' : '⚠️ FAILED';
          const overallStatus = (healthStatus === '✅ PASSED' && lintStatus === '✅ PASSED') ? '✅ EXCELLENT' : '⚠️ NEEDS ATTENTION';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 🔍 REOS Quality Checks\n\n**Overall Status**: ${overallStatus}\n\n### Check Results\n- **Health Check**: ${healthStatus}\n- **Markdown Lint**: ${lintStatus}\n\nFull reports available in workflow artifacts.`
          });
