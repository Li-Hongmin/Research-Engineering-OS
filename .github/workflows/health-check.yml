name: REOS Health Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run health check every day at 09:00 JST (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  health-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false
    
    - name: Setup mdBook
      uses: peaceiris/actions-mdbook@v2
      with:
        mdbook-version: 'latest'
    
    - name: Run REOS health check
      run: |
        chmod +x check_health.sh
        ./check_health.sh
    
    - name: Upload health report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: health-report
        path: |
          check_health.sh
        retention-days: 7
    
    - name: Comment health status on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const exitCode = process.env.EXIT_CODE || '0';
          const status = exitCode === '0' ? '✅ EXCELLENT' : '⚠️ NEEDS ATTENTION';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 🔍 REOS Health Check\n\n**Status**: ${status}\n\nFull health report available in workflow artifacts.`
          });
