# 第八章「多路径探索」分镜脚本
chapter: "08-multi-path"
title_zh: "多路径探索"
title_en: "Multi-Path Exploration"

panels:
  - id: "08_001"
    description_zh: "学了AI协作的规范后，小研面临了一个新的研究难题。她有两个可能的研究方向摆在面前——方法A看起来简洁，方法B似乎更强大。但该选哪个呢？她盯着两份实验方案，陷入了深深的纠结。因为她知道，如果选错了方向，可能就要浪费几周的时间。一旦投入了，再改方向的代价太大了。"
  - id: "08_002"
    description_zh: "之前的教训还深深扎在她心里。有一次，她坚持一个方向写了整整两周的代码，到最后才发现这条路走不通——算法本身有根本的局限。所有的工作都白费了，她不得不从头开始。那种失败和浪费的感受，她不想再经历。现在的她，变得谨慎了，甚至有点犹豫不决。"
  - id: "08_003"
    description_zh: "导师见她在办公室里纠结了好几天，走过来问：'你在想什么呢？'小研把情况说了一遍。导师听完后，笑了笑，'你为什么一定要选一个？'小研愣住了。导师继续说：'Git分支的目的之一，就是让你能同时探索多条路。在不同的分支上，你可以尝试不同的想法，最后再决定哪个更好。'小研的眼睛一下子亮了起来——对啊，为什么非要赌一个方向呢？我可以都试试！"
  - id: "08_004"
    description_zh: "导师教她一个清晰的分支策略。main分支永远保持稳定和可运行的状态，只有经过验证的最佳方案才能合并到main。实验分支则是自由的、临时的、可以随时丢弃。这样，稳定性和探索性的目标完全分离，不会互相干扰。"
  - id: "08_005"
    description_zh: "小研创建了两个分支：experiment-A和experiment-B。每个分支代表一个研究方向。她在两个分支上几乎同时工作——用git worktree这个工具，她可以同时在两个目录里开发，不需要频繁切换。"
  - id: "08_006"
    description_zh: "在分支A里，小研实现了方法A的想法。她写代码、跑实验、记录日志。一周后，方法A有了初步结果。她在这个分支上建立了一个标签，标记这个版本的里程碑。"
  - id: "08_007"
    description_zh: "同时，在分支B里，方法B也在进行。这是小研最喜欢的地方——不同的想法在平行的时间里发展，就像平行宇宙一样。不同的分支没有干扰彼此，每个分支都是独立的实验室。"
  - id: "08_008"
    description_zh: "两周后，小研有了两个方法的初步结果。她用实验追踪系统（比如MLflow或Weights & Biases）来对比。清晰的对比表格和图表出现在面前：方法A在某个指标上表现更好，方法B在另一个指标上领先。性能对比一目了然。"
  - id: "08_009"
    description_zh: "更有趣的发现是：两个方法各有所长。方法A更快，但准确率略低。方法B准确率更高，但比较慢。小研突然想到：为什么不结合它们呢？为什么不用方法B的核心思想，但用方法A的加速技巧呢？"
  - id: "08_010"
    description_zh: "她创建了第三个分支：experiment-C，是A和B的混合体。这次，她用的是之前学到的所有知识：清晰的实验单元、记录所有的配置、详细的日志、完整的测试。混合方案在一周内成形，而且性能指标超过了A和B。"
  - id: "08_011"
    description_zh: "使用git worktree，小研可以在三个目录里同时工作，不需要频繁的git checkout。修改代码、跑实验、看结果，切换分支就和切换窗口一样简单。这种高效的工作方式让她有动力去尝试更多的想法。"
  - id: "08_012"
    description_zh: "有一天，小研在分支A里发现了一个通用的性能优化技巧。这个技巧对A、B、C都有帮助。她在A分支上完成了这个优化，然后用cherry-pick命令把改动应用到B和C。不同的分支同时受益，成果得到了复用。"
  - id: "08_013"
    description_zh: "小研在每个分支上都记录了详细的实验结果和洞察。不仅仅是数字，还有定性的观察：'这个方法的优势在于…'、'这个方法的瓶颈是…'、'如果遇到这种情况就会失败'。这些记录，成了评估的基础。"
  - id: "08_014"
    description_zh: "一个月后，评估时刻到来。综合考虑性能、可理解性、可维护性、计算成本等多个因素，小研决定了：方法C（混合体）是最好的选择。它既有A的速度优势，也有B的准确性优势，而且混合的逻辑是清晰且可控的。"
  - id: "08_015"
    description_zh: "合并experiment-C到main时，小研很谨慎。她不是简单地把所有代码复制过去，而是仔细地整理了代码。删除了实验过程中的临时日志，确保代码的清洁。这样，main分支收到的是精心准备的、高质量的代码。"
  - id: "08_016"
    description_zh: "小研在提交信息和代码注释里详细地记录了决策过程：'为什么选择方法C而不是A或B？方法A的优点是…，缺点是…。方法B的优点是…，缺点是…。'未来的维护者（包括未来的自己）可以通过这些记录理解当初为什么做出这个选择。"
  - id: "08_017"
    description_zh: "'不要删除那些失败的分支。'导师说。小研保留了experiment-A和experiment-B。这些分支是她探索的历史，是她失败和学习的证明。将来，如果需要回顾为什么不选A或B，这些分支就是活生生的证据。而且，也许某天会有新的想法，需要用到A或B的某部分。"
  - id: "08_018"
    description_zh: "小研为自己的项目建立了分支命名规范。实验分支以'experiment/'开头，新功能以'feature/'开头，bug修复以'bugfix/'开头。这样，任何看代码的人都能从分支名一眼看出它是什么用途。"
  - id: "08_019"
    description_zh: "在重要的实验节点，小研用git tag（标签）来标记。'v1-baseline'、'v2-with-optimization'、'v3-hybrid-approach'。这些标签像路标一样，清楚地标记出了每个关键的实验版本。日后，审稿人或合作者可以轻松地检出某个特定的版本。"
  - id: "08_020"
    description_zh: "导师看着小研的git图谱——有main分支作为脊梁，多条实验分支在探索，标签和notes标记出了关键路点——赞许地说：'看见没有？并行探索让你看到了完整的解空间。你不再是赌一个方向，而是理性地、全面地评估了多个选项。这就是工程思维。'"
  - id: "08_021"
    description_zh: "小研分享了她的经验：'分支让我勇于尝试，因为失败的代价很低。想试一个疯狂的想法？开个新分支就行。即使失败了，main还是好好的，而且失败的过程也被记录下来，可以学习。'这种心理安全感，让她有勇气去探索。"
  - id: "08_022"
    description_zh: "小研的Git图谱就像一棵茂盛的树：main是坚实的树干，多条实验分支像树枝一样伸出去，最终最优的分支回归到树干。这张图不仅展示了代码的发展，也展示了思想的演变过程。当人们看到这张图时，就能理解她的探索历程——不是侥幸，而是系统和理性的研究方法。"
