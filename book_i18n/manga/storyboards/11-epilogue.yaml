# 终章「论文提交成功」分镜脚本
# Epilogue: "Paper Submitted Successfully"
# 15 panels wrapping up Xiao Yan's growth story

chapter: "11-epilogue"
title_zh: "论文提交成功"
title_en: "Paper Submitted Successfully"
title_ja: "論文投稿成功"

style_base: |
  Japanese manga illustration, clean anime art style,
  young Asian female researcher protagonist (casual clothes or lab coat, glasses optional),
  expressive anime eyes, dynamic composition, professional digital art,
  cel-shading, cinematic lighting, no text or speech bubbles.

panels:
  # The Moment of Submission (panels 1-3)
  - id: "11_001"
    type: "climax"
    description_zh: "小研点击提交按钮的瞬间"
    description_en: "The moment Xiao Yan clicks submit"
    prompt: |
      Dramatic close-up of finger about to click submit button,
      screen showing completed submission form,
      time frozen in this decisive moment,
      climactic action.

  - id: "11_002"
    type: "success"
    description_zh: "提交成功！确认邮件到达"
    description_en: "Submission successful! Confirmation email arrives"
    prompt: |
      Submission confirmation appearing on screen,
      "Thank you for your submission" message,
      relief and joy washing over researcher's face,
      mission accomplished.

  - id: "11_003"
    type: "celebration"
    description_zh: "庆祝：不是疲惫而是满足"
    description_en: "Celebration: not exhaustion but satisfaction"
    prompt: |
      Researcher celebrating with genuine happiness,
      no dark circles, no coffee cups pile,
      healthy completion, sustainable victory,
      earned celebration.

  # Journey Reflection (panels 4-8)
  - id: "11_004"
    type: "reflection"
    description_zh: "回顾：从序章的恐慌到现在"
    description_en: "Looking back: from prologue panic to now"
    prompt: |
      Split panel showing transformation,
      left: panicked researcher from chapter 0,
      right: calm confident researcher now,
      dramatic growth visualization.

  - id: "11_005"
    type: "montage"
    description_zh: "学到的一切：快闪回顾"
    description_en: "Everything learned: quick flashback montage"
    prompt: |
      Montage of key lessons from each chapter,
      three debts, experiment unit, repo structure,
      git, DoD, logging, AI, multi-path, prevention, team,
      knowledge collected visualization.

  - id: "11_006"
    type: "gratitude"
    description_zh: "感谢：Research Engineering OS这本书"
    description_en: "Gratitude: the Research Engineering OS book"
    prompt: |
      Researcher holding the book that started her journey,
      grateful expression, book glowing warmly,
      mentor's gift that changed everything,
      full circle moment.

  - id: "11_007"
    type: "change"
    description_zh: "变化：从reactive到proactive"
    description_en: "Change: from reactive to proactive"
    prompt: |
      Visualization of mindset shift,
      before: firefighter running to emergencies,
      after: architect building with prevention,
      fundamental transformation.

  - id: "11_008"
    type: "identity"
    description_zh: "新身份：可靠的研究者"
    description_en: "New identity: reliable researcher"
    prompt: |
      Researcher with new confidence and reputation,
      colleagues trusting her, mentor proud,
      earned credibility, professional growth,
      identity transformed.

  # Paying It Forward (panels 9-12)
  - id: "11_009"
    type: "new_character"
    description_zh: "新来的同学来问问题"
    description_en: "New student comes to ask questions"
    prompt: |
      Young new research student approaching Xiao Yan,
      confused and overwhelmed expression,
      just like Xiao Yan was at the beginning,
      cycle continuing.

  - id: "11_010"
    type: "mentoring"
    description_zh: "小研开始指导新人"
    description_en: "Xiao Yan starts mentoring the newcomer"
    prompt: |
      Researcher now in mentor role,
      patiently explaining concepts,
      passing on what she learned,
      knowledge transfer.

  - id: "11_011"
    type: "gift"
    description_zh: "递出自己的Research Engineering OS"
    description_en: "Handing over her Research Engineering OS book"
    prompt: |
      Researcher giving her book to new student,
      the same glowing book she received,
      wisdom being passed forward,
      torch passing moment.

  - id: "11_012"
    type: "hope"
    description_zh: "新人眼中的希望"
    description_en: "Hope in the newcomer's eyes"
    prompt: |
      New student's eyes lighting up with hope,
      just like Xiao Yan's did when she first received help,
      cycle of learning beginning again,
      hope renewed.

  # Final Message (panels 13-15)
  - id: "11_013"
    type: "message"
    description_zh: "核心信息：好习惯是最好的投资"
    description_en: "Core message: good habits are the best investment"
    prompt: |
      Beautiful visualization of compound returns,
      small daily habits becoming massive results,
      investment metaphor, exponential growth,
      core philosophy.

  - id: "11_014"
    type: "invitation"
    description_zh: "邀请：你也可以成为小研"
    description_en: "Invitation: you can become Xiao Yan too"
    prompt: |
      Researcher looking directly at reader,
      inviting gesture, breaking fourth wall,
      "Your turn" implication,
      reader engagement.

  - id: "11_015"
    type: "ending"
    description_zh: "结尾：新的一天开始"
    description_en: "Ending: a new day begins"
    prompt: |
      Researcher at window looking at sunrise,
      organized desk, bright future ahead,
      new research day beginning with confidence,
      hopeful ending, sunrise composition.
