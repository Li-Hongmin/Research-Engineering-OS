# 第七章「AI协作工作流」分镜脚本
chapter: "07-ai-workflow"
title_zh: "AI协作工作流"
title_en: "AI Collaboration Workflow"

panels:
  - id: "07_001"
    description_zh: "日志系统完善后，小研迎来了AI时代的第一次诱惑。某个下午，她听说了ChatGPT能生成代码。抱着试试看的心态，她输入了一个问题：'给我写一个处理CSV文件的函数'。不到三秒钟，屏幕上就出现了一个完整的、格式漂亮的函数。小研简直不敢相信——'这怎么可能？太快了！'她没有多想，直接复制粘贴到了项目里。"
  - id: "07_002"
    description_zh: "一周后的场景截然不同。小研坐在电脑前，盯着满屏的错误信息。她想要修改AI写的代码以修复bug，却发现自己根本看不懂这段代码的逻辑。为什么这里用了这样的数据结构？为什么那里要这样处理边界情况？她试着逐行阅读，感到越来越困惑。最糟的是，这是她自己的项目，她应该理解其中的每一行代码，但现在她像个局外人一样无力。"
  - id: "07_003"
    description_zh: "导师经过她的座位，看到了她挣扎的样子。'出什么问题了？'导师问。小研指着屏幕说：'AI生成的代码有bug，我想改，但我根本看不懂它。'导师停顿了一下，然后用平静但坚定的语气说：'这就是问题所在。AI可以写代码，但它不能替你理解代码。当出了问题，需要你去修，你却看不懂——那责任还是在你身上。'小研突然明白了，她不是在节省时间，而是在冒风险。"
  - id: "07_004"
    description_zh: "小研开始反思盲目信任AI的后果。代码难以调试，因为她不知道为什么这样写。代码难以维护，因为下一个接手的人也看不懂。代码难以改进，因为没人清楚其中的每个决策。更重要的是，如果结果出了问题，她没有办法解释代码为什么这样做。这是一种危险的、不负责任的方式。"
  - id: "07_005"
    description_zh: "'AI时代的关键，不是如何用AI生成代码，而是如何负责任地使用AI。'导师给了她一个建议。首先，要明确定义需求和约束。不是模糊地说'给我写个函数'，而是详细地说：'这个函数应该处理什么数据、返回什么格式、要满足什么性能要求、需要处理什么边界情况'。"
  - id: "07_006"
    description_zh: "第二步，使用AI生成框架和起点，但不要直接复制粘贴。小研开始让AI生成代码框架，然后自己填充实现细节。这样，她对每一部分都有主动的理解。AI是'建议者'，她是'决策者'。"
  - id: "07_007"
    description_zh: "'把AI生成的代码当作同事的代码来审查。'导师说。如果一个同事提交了代码，小研会问：这为什么这样做？有没有更简洁的写法？性能怎么样？边界情况处理了吗？她也要以同样的标准对待AI的代码。代码评审不是形式，而是理解和确保质量的过程。"
  - id: "07_008"
    description_zh: "添加测试用例来验证AI代码的正确性。不能只看代码，要实际跑一遍。而且不只是跑一遍，要设计完整的测试用例，包括正常情况、边界情况、错误情况。如果AI代码通不过测试，就说明有问题。"
  - id: "07_009"
    description_zh: "小研开始记录生成AI代码时用的prompt。这成了设计文档的一部分——'我问AI的是什么、AI回答的是什么、我对代码做了什么修改、为什么要做这些修改'。这样，日后维护代码的人（包括未来的自己）都能理解背后的思路。"
  - id: "07_010"
    description_zh: "建立一个迭代流程：生成→审查→测试→改进。不是生成代码就完事，而是不断地循环。'这个地方能不能更简洁？''这个测试失败了，原因是什么？''有没有更高效的算法？'每一轮迭代，代码都会更好。"
  - id: "07_011"
    description_zh: "小研发现AI很擅长辅助文档编写。她用AI起草一个模块的说明文档，然后人工审查、修正、补充。效率提高了三倍，质量也没有下降。但关键是，她始终保持着对内容的审查权。"
  - id: "07_012"
    description_zh: "让AI帮助生成测试用例也很有效。小研告诉AI：'这个函数的输入是什么、输出是什么、可能的边界情况是什么'。AI生成了一堆测试用例。她逐个审查，有时候会调整或补充。这样，测试覆盖率大幅提高，而她也对每个测试用例都有清晰的理解。"
  - id: "07_013"
    description_zh: "当面对复杂代码时，小研用AI来帮助解释逻辑。'这段代码做了什么？为什么要这样做？'AI的解释帮助她快速理解。但她不会只听AI的，而是在AI的基础上自己再想一遍，确保理解正确。"
  - id: "07_014"
    description_zh: "AI还能协助重构代码。小研告诉AI：'我有这段代码，想要改进性能/可读性'。AI给出了建议。小研评估这些建议，选择其中有价值的，自己实现。人工保持最终的决策权，AI只是提供选项。"
  - id: "07_015"
    description_zh: "小研开始建立一个'prompt库'——有效的提示词模板。'给我生成一个处理CSV的函数'是低质量的prompt；'生成一个函数，读取CSV文件，每行是一条记录，需要处理缺失值、返回pandas DataFrame'是高质量的prompt。好的prompt能得到更好的代码。"
  - id: "07_016"
    description_zh: "版本控制AI交互记录也变得重要。小研用一个txt文件记录：什么时候、问了什么prompt、AI回答的要点、自己的改动。这不仅是历史记录，也是透明度的证明——证明她没有直接用AI的输出，而是经过了思考和修改。"
  - id: "07_017"
    description_zh: "'建立AI使用边界。'导师给了最后的建议。哪些任务适合用AI？初稿创意、代码框架、文档起草。哪些必须人工做？关键设计、测试设计、安全审查、最终决策。界限清晰，才能避免过度依赖。"
  - id: "07_018"
    description_zh: "最重要的是，小研培养了critical thinking——对AI的每一个输出都保持质疑。AI说对了吗？有更好的方案吗？这里有没有隐藏的假设？带着这样的怀疑，她不会被AI牵着走，而是主动地、理性地使用AI。"
  - id: "07_019"
    description_zh: "现在小研的工作流变成了：AI辅助起草，人工精细打磨。她用AI快速生成初版，然后花大部分时间在审查、理解、改进上。这样，她既享受了AI的效率，又保持了对代码的完全掌控和理解。"
  - id: "07_020"
    description_zh: "导师看着小研的新工作方式，欣慰地说：'你学会了最重要的一课——保持主导权。AI是工具，你是使用者。永远不要让工具来决定你的工作方式，而是要让你的价值观和需求决定如何使用工具。'"
  - id: "07_021"
    description_zh: "小研开始帮助实验室的其他同学建立AI协作规范。她分享自己的经验、提示词模板、代码审查checklist。越来越多的人意识到，正确地使用AI，需要学习和规范。"
  - id: "07_022"
    description_zh: "整个实验室制定了AI使用最佳实践文档。其中包括：什么时候用AI、怎么写prompt、代码怎么审查、结果怎么验证、如何记录。这成了新成员的必读材料。"
  - id: "07_023"
    description_zh: "在一次组会上，导师和大家讨论了AI时代的研究诚信问题。'使用AI不违反诚信，但隐瞒AI的使用方式就违反了。'导师说，'你应该明确说：这个部分是AI生成的，我做了哪些审查和修改。透明度是关键。'"
  - id: "07_024"
    description_zh: "小研的感悟深化了：'AI让我们更高效，但思考不能外包。效率再高，如果失去了理解，就失去了科研的本质。'这句话她反复念了好几遍，最后写进了她的论文前言里。"
  - id: "07_025"
    description_zh: "她在办公室的白板上用大字写下：'Human in the loop, AI as the tool. 人类保持在循环里，AI只是工具。'这句话看似简单，但代表了她在AI时代学到的最深刻的教训。"
