# 第七章「AI助手的陷阱」分镜脚本
# Chapter 7: "AI Assistant Traps"
# 25 panels on working correctly with AI coding assistants

chapter: "07-ai-workflow"
title_zh: "AI助手的陷阱"
title_en: "AI Assistant Traps"
title_ja: "AIアシスタントの罠"

style_base: |
  Japanese manga illustration, clean anime art style,
  young Asian female researcher protagonist (casual clothes or lab coat, glasses optional),
  expressive anime eyes, dynamic composition, professional digital art,
  cel-shading, cinematic lighting, no text or speech bubbles.

panels:
  # Opening: The AI Promise (panels 1-5)
  - id: "07_001"
    type: "establishing"
    description_zh: "小研发现AI编程助手，效率飙升"
    description_en: "Xiao Yan discovers AI coding assistant, productivity soars"
    prompt: |
      Researcher excitedly using AI coding assistant,
      code appearing magically fast on screen,
      AI robot helper working alongside,
      productivity visualization soaring upward.

  - id: "07_002"
    type: "excitement"
    description_zh: "一天完成一周的工作量"
    description_en: "One day's work equals one week"
    prompt: |
      Researcher amazed at speed of development,
      progress bar filling rapidly,
      features being implemented at lightning speed,
      euphoria of AI-assisted coding.

  - id: "07_003"
    type: "warning"
    description_zh: "但是...代码真的对吗？"
    description_en: "But... is the code actually correct?"
    prompt: |
      First seeds of doubt appearing,
      researcher looking more closely at AI code,
      small question marks forming around code,
      suspicion beginning.

  - id: "07_004"
    type: "discovery"
    description_zh: "发现：AI代码里藏着bug"
    description_en: "Discovery: bugs hidden in AI code"
    prompt: |
      Researcher finding subtle bug in AI-generated code,
      code looking correct on surface but logic flaw inside,
      bug revealed under magnifying glass,
      hidden danger exposed.

  - id: "07_005"
    type: "crisis"
    description_zh: "危机：整个系统建立在有bug的基础上"
    description_en: "Crisis: entire system built on buggy foundation"
    prompt: |
      Researcher realizing the scope of the problem,
      building collapsing because foundation was flawed,
      domino effect of bugs spreading,
      house of cards falling.

  # The Five AI Traps (panels 6-15)
  - id: "07_006"
    type: "trap_intro"
    description_zh: "AI的五个陷阱"
    description_en: "Five traps of AI"
    prompt: |
      Five trap doors appearing on path to success,
      each labeled with a trap type,
      researcher must navigate carefully,
      danger visualization.

  - id: "07_007"
    type: "trap"
    description_zh: "陷阱1：速度的诱惑"
    description_en: "Trap 1: temptation of speed"
    prompt: |
      Researcher running too fast toward goal,
      speed lines but approaching cliff edge,
      "fast" doesn't mean "correct",
      speed trap visualization.

  - id: "07_008"
    type: "trap"
    description_zh: "陷阱2：隐藏的逻辑错误"
    description_en: "Trap 2: hidden logic errors"
    prompt: |
      AI code that looks perfect but has subtle logic bug,
      correct syntax, wrong semantics,
      bug camouflaged in reasonable-looking code,
      deceptive correctness.

  - id: "07_009"
    type: "trap"
    description_zh: "陷阱3：过时的知识"
    description_en: "Trap 3: outdated knowledge"
    prompt: |
      AI suggesting deprecated library usage,
      old API calls, outdated patterns,
      warning symbols on suggested code,
      knowledge cutoff problem.

  - id: "07_010"
    type: "trap"
    description_zh: "陷阱4：幻觉代码"
    description_en: "Trap 4: hallucinated code"
    prompt: |
      AI confidently suggesting non-existent function,
      function that doesn't exist in the library,
      researcher trying to use it and failing,
      hallucination trap.

  - id: "07_011"
    type: "trap"
    description_zh: "陷阱5：失去理解"
    description_en: "Trap 5: losing understanding"
    prompt: |
      Researcher surrounded by AI code she doesn't understand,
      complexity growing but comprehension shrinking,
      lost in own codebase,
      ownership loss.

  - id: "07_012"
    type: "consequence"
    description_zh: "后果：无法debug自己的代码"
    description_en: "Consequence: can't debug your own code"
    prompt: |
      Researcher unable to fix bug in AI-generated code,
      code is foreign even though it's in her repo,
      helplessness and frustration,
      understanding debt.

  - id: "07_013"
    type: "consequence"
    description_zh: "后果：无法解释给审稿人"
    description_en: "Consequence: can't explain to reviewers"
    prompt: |
      Reviewer asking "why did you do X?",
      researcher stammering, can't explain AI's choice,
      credibility loss, embarrassment,
      knowledge gap exposed.

  - id: "07_014"
    type: "reflection"
    description_zh: "反思：AI让代码生成容易，验证变难"
    description_en: "Reflection: AI makes generation easy, verification hard"
    prompt: |
      Balance scale showing paradigm shift,
      "writing code" becoming lighter,
      "verifying code" becoming heavier,
      new challenge of AI era.

  - id: "07_015"
    type: "principle"
    description_zh: "原则：AI是助手，不是替代"
    description_en: "Principle: AI is assistant, not replacement"
    prompt: |
      Healthy relationship with AI assistant,
      researcher in driver's seat, AI as co-pilot,
      human making decisions, AI helping execute,
      proper collaboration model.

  # The Right Way (panels 16-22)
  - id: "07_016"
    type: "solution"
    description_zh: "正确方式1：理解再使用"
    description_en: "Right way 1: understand before using"
    prompt: |
      Researcher carefully reading AI-generated code,
      line by line understanding before accepting,
      thoughtful evaluation, not blind acceptance,
      comprehension first.

  - id: "07_017"
    type: "solution"
    description_zh: "正确方式2：小块验证"
    description_en: "Right way 2: verify in small pieces"
    prompt: |
      Researcher testing AI code piece by piece,
      unit tests for each function,
      incremental validation, building confidence,
      small verified blocks.

  - id: "07_018"
    type: "solution"
    description_zh: "正确方式3：写测试在前"
    description_en: "Right way 3: write tests first"
    prompt: |
      Researcher writing test before asking AI for implementation,
      test defines expected behavior,
      AI code must pass researcher's tests,
      test-driven AI usage.

  - id: "07_019"
    type: "solution"
    description_zh: "正确方式4：保持可回退"
    description_en: "Right way 4: keep ability to rollback"
    prompt: |
      Researcher maintaining clean git history with AI code,
      easy to revert AI-generated changes,
      safety net always ready,
      rollback capability.

  - id: "07_020"
    type: "solution"
    description_zh: "正确方式5：教AI你的风格"
    description_en: "Right way 5: teach AI your style"
    prompt: |
      Researcher providing context and examples to AI,
      AI learning project conventions,
      customized AI assistance,
      trained collaboration.

  - id: "07_021"
    type: "practice"
    description_zh: "实践：AI代码Review清单"
    description_en: "Practice: AI code review checklist"
    prompt: |
      Checklist for reviewing AI-generated code,
      logic correct? tests pass? understood? documented?,
      systematic AI code evaluation,
      quality assurance process.

  - id: "07_022"
    type: "workflow"
    description_zh: "工作流：人+AI的协作循环"
    description_en: "Workflow: human+AI collaboration cycle"
    prompt: |
      Circular workflow diagram,
      Human defines → AI generates → Human verifies → Human refines,
      healthy collaboration cycle,
      sustainable AI partnership.

  # Closing (panels 23-25)
  - id: "07_023"
    type: "benefit"
    description_zh: "好处：AI提升效率，人保持掌控"
    description_en: "Benefit: AI boosts efficiency, human keeps control"
    prompt: |
      Best of both worlds visualization,
      researcher benefiting from AI speed,
      but maintaining understanding and ownership,
      empowered researcher.

  - id: "07_024"
    type: "action"
    description_zh: "10分钟行动：为AI代码写一个测试"
    description_en: "10-minute action: write a test for AI code"
    prompt: |
      Researcher writing test for recently accepted AI code,
      verification of existing AI-generated code,
      quick quality check,
      practical first step.

  - id: "07_025"
    type: "preview"
    description_zh: "下一章预告：多路探索"
    description_en: "Next chapter preview: multi-path exploration"
    prompt: |
      Preview of multiple research paths diverging,
      researcher at crossroads,
      how to manage parallel explorations,
      path management about to be learned.
