# 第七章「AI协作工作流」分镜脚本
chapter: "07-ai-workflow"
title_zh: "AI协作工作流"
title_en: "AI Collaboration Workflow"

panels:
  - id: "07_001"
    description_zh: "这天，小研第一次用ChatGPT生成代码。看着屏幕上瞬间出现的完整函数，她简直不敢相信：'这...几秒钟就搞定了？太神奇了！'她兴奋地把代码复制进项目，连看都没仔细看。"
  - id: "07_002"
    description_zh: "一周后。小研盯着满屏的错误信息，想要修改AI生成的代码，却发现自己根本看不懂。逻辑是怎么走的？为什么这里要这样写？她感到一阵无力——这是她自己的项目，但她却像个外人。"
  - id: "07_003"
    description_zh: "导师走过来，看了看屏幕，平静地说：'AI可以写代码，但不能替你理解代码。出了问题，还是你来背锅。'小研愣住了。她突然意识到，自己把最重要的东西——理解和掌控——拱手让给了AI。"
  - id: "07_004"
    description_zh: "回顾：盲目信任AI的后果，难以调试、难以维护的代码。"
  - id: "07_005"
    description_zh: "建立AI协作规范：第一步，明确定义需求和约束。"
  - id: "07_006"
    description_zh: "使用AI生成代码框架，但保持人工审查每一部分。"
  - id: "07_007"
    description_zh: "对AI生成的代码进行代码评审，就像对待同事的代码一样。"
  - id: "07_008"
    description_zh: "添加测试用例验证AI代码的正确性。"
  - id: "07_009"
    description_zh: "记录AI生成代码的prompt，作为设计文档的一部分。"
  - id: "07_010"
    description_zh: "建立迭代流程：生成→审查→测试→改进。"
  - id: "07_011"
    description_zh: "使用AI辅助文档编写，提高效率但保持准确性。"
  - id: "07_012"
    description_zh: "让AI帮助生成测试用例，覆盖边界条件。"
  - id: "07_013"
    description_zh: "使用AI进行代码解释，帮助理解复杂逻辑。"
  - id: "07_014"
    description_zh: "AI协助重构，但保持人工决策权。"
  - id: "07_015"
    description_zh: "建立prompt库：记录有效的提示词模板。"
  - id: "07_016"
    description_zh: "版本控制AI交互记录，追踪决策过程。"
  - id: "07_017"
    description_zh: "设置AI使用边界：哪些可以用AI，哪些必须人工。"
  - id: "07_018"
    description_zh: "培养critical thinking：质疑AI的每一个输出。"
  - id: "07_019"
    description_zh: "小研现在的工作流：AI辅助起草，人工精细打磨。"
  - id: "07_020"
    description_zh: "导师评价：'你学会了最重要的一课——保持主导权。'"
  - id: "07_021"
    description_zh: "小研帮助其他同学建立AI协作规范。"
  - id: "07_022"
    description_zh: "实验室建立了AI使用最佳实践文档。"
  - id: "07_023"
    description_zh: "讨论：AI时代的研究诚信和透明度。"
  - id: "07_024"
    description_zh: "小研的感悟：'AI让我们更高效，但思考不能外包。'"
  - id: "07_025"
    description_zh: "结尾：小研在白板上写下：'Human in the loop, AI as the tool.'"
