# 第八章「多路径探索」分镜脚本
chapter: "08-multi-path"
title_zh: "多路径探索"
title_en: "Multi-Path Exploration"

panels:
  - id: "08_001"
    description_zh: "新的难题来了。小研手里有两个可能的研究方向，各有优劣。选A？还是选B？她盯着两份实验方案，迟迟下不了决心。因为她知道，一旦选错，就要推倒重来。"
  - id: "08_002"
    description_zh: "上次的教训还历历在目。那时她押宝在一个方向上，写了两周代码，最后发现走不通。重来的时候，之前的工作全废了。她不想再经历那种感觉。"
  - id: "08_003"
    description_zh: "导师看出了她的纠结，笑着说：'谁说必须二选一？Git的分支功能，就是让你能同时探索多条路。'小研眼睛一亮。对啊，为什么要赌？可以都试试！"
  - id: "08_004"
    description_zh: "Git分支策略：main分支保持稳定，实验分支并行探索。"
  - id: "08_005"
    description_zh: "创建experiment-A和experiment-B两个分支。"
  - id: "08_006"
    description_zh: "在分支A中实现方法1，记录初步结果。"
  - id: "08_007"
    description_zh: "在分支B中实现方法2，同时进行。"
  - id: "08_008"
    description_zh: "使用实验追踪系统对比两种方法的性能。"
  - id: "08_009"
    description_zh: "发现方法A在某些case下更好，方法B在另外的case下更优。"
  - id: "08_010"
    description_zh: "创建混合方案分支experiment-C，结合两者优势。"
  - id: "08_011"
    description_zh: "使用git worktree同时在多个分支工作。"
  - id: "08_012"
    description_zh: "定期同步各分支的通用改进。"
  - id: "08_013"
    description_zh: "记录每个分支的实验结果和洞察。"
  - id: "08_014"
    description_zh: "最终决策：方法C表现最好，准备合并到main。"
  - id: "08_015"
    description_zh: "清理合并：只保留必要的代码，移除实验痕迹。"
  - id: "08_016"
    description_zh: "文档化：记录为什么选择方法C，其他方法的优缺点。"
  - id: "08_017"
    description_zh: "保留失败的实验分支作为参考，不要删除历史。"
  - id: "08_018"
    description_zh: "建立分支命名规范：experiment/、feature/、bugfix/。"
  - id: "08_019"
    description_zh: "使用标签标记重要的实验节点。"
  - id: "08_020"
    description_zh: "导师赞许：'并行探索让你看到了完整的解空间。'"
  - id: "08_021"
    description_zh: "小研分享经验：'分支让我勇于尝试，失败也不可怕。'"
  - id: "08_022"
    description_zh: "结尾：小研的git图谱展示了完整的探索历程，像一棵茂盛的树。"
