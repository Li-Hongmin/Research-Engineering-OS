# 第十章「团队协作」分镜脚本
chapter: "10-team"
title_zh: "团队协作"
title_en: "Team Collaboration"

panels:
  - id: "10_001"
    description_zh: "半年过去了。小研的项目越来越稳定。代码清晰，日志完善，Git历史记录良好。导师注意到了她的进步，决定让她加入一个大型的合作项目。那天她兴高采烈地打开共享代码库...然后僵住了。同样的功能，五种不同的实现方式。命名一会儿驼峰一会儿下划线。注释有人写英文有人写中文。这...这真的是一个项目吗？"
  - id: "10_002"
    description_zh: "她提交了自己的第一段代码。但merge时，满屏的冲突让她目瞪口呆。她花了三个小时才手工合并完。好容易完成了，第二天又有人的代码和她冲突了。小研盯着屏幕，感到整个人都被吸入了冲突地狱。这样下去...她用在编码上的时间可能都没有用在解决冲突上的时间多。"
  - id: "10_003"
    description_zh: "周一的团队会议上，其他几个成员也在诉苦。冲突、混乱、效率低下。导师静静地听着，然后敲了敲桌子：'我们需要建立规范了。代码风格、提交流程、review机制...一切都需要标准化。'小研点了点头。她突然明白了：那些她曾经觉得繁琐的规范，存在的原因是什么。"
  - id: "10_004"
    description_zh: "制定代码规范：统一的格式化、命名约定、注释要求。"
  - id: "10_005"
    description_zh: "使用代码格式化工具：black、prettier，自动保持一致。"
  - id: "10_006"
    description_zh: "建立代码评审流程：Pull Request必须经过审查才能合并。"
  - id: "10_007"
    description_zh: "小研提交第一个PR，收到详细的review反馈。"
  - id: "10_008"
    description_zh: "学习如何给出建设性的代码评审意见。"
  - id: "10_009"
    description_zh: "建立分支策略：feature分支、develop分支、main分支。"
  - id: "10_010"
    description_zh: "使用CI/CD自动化测试和部署。"
  - id: "10_011"
    description_zh: "建立issue追踪系统：清晰记录任务和bug。"
  - id: "10_012"
    description_zh: "使用项目看板：可视化任务进度。"
  - id: "10_013"
    description_zh: "编写团队文档：README、CONTRIBUTING、架构说明。"
  - id: "10_014"
    description_zh: "建立定期会议机制：站会、周会、里程碑评审。"
  - id: "10_015"
    description_zh: "使用异步沟通工具：减少打扰，提高效率。"
  - id: "10_016"
    description_zh: "建立知识库：记录团队的决策和经验。"
  - id: "10_017"
    description_zh: "实施结对编程：解决复杂问题时协同工作。"
  - id: "10_018"
    description_zh: "建立导师制度：老成员帮助新成员快速上手。"
  - id: "10_019"
    description_zh: "处理团队冲突：技术分歧用数据说话。"
  - id: "10_020"
    description_zh: "庆祝里程碑：团队一起完成了第一个大版本。"
  - id: "10_021"
    description_zh: "回顾会议：总结经验，持续改进流程。"
  - id: "10_022"
    description_zh: "小研从团队新手成长为可以独当一面的contributor。"
  - id: "10_023"
    description_zh: "她开始指导新加入的学生。"
  - id: "10_024"
    description_zh: "导师欣慰：'团队协作能力和技术能力同样重要。'"
  - id: "10_025"
    description_zh: "结尾：团队照片，小研站在中间，自信地微笑。"
