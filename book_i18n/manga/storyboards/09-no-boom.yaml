# 第九章「炸弹拆除」分镜脚本
# Chapter 9: "Bomb Defusal"
# 25 panels on preventing deadline disasters

chapter: "09-no-boom"
title_zh: "炸弹拆除"
title_en: "Bomb Defusal"
title_ja: "爆弾解除"

style_base: |
  Japanese manga illustration, clean anime art style,
  young Asian female researcher protagonist (casual clothes or lab coat, glasses optional),
  expressive anime eyes, dynamic composition, professional digital art,
  cel-shading, cinematic lighting, no text or speech bubbles.

panels:
  # Opening: The Countdown (panels 1-4)
  - id: "09_001"
    type: "establishing"
    description_zh: "截止日期倒计时：5天"
    description_en: "Deadline countdown: 5 days"
    prompt: |
      Dramatic countdown timer showing 5 days remaining,
      researcher aware of approaching deadline,
      tension beginning to build,
      ominous countdown visualization.

  - id: "09_002"
    type: "calm"
    description_zh: "但是小研很平静：她已经准备好了"
    description_en: "But Xiao Yan is calm: she's already prepared"
    prompt: |
      Researcher calmly working, organized setup,
      checklist mostly completed, no panic,
      contrast to chapter 1's chaos,
      preparedness visualization.

  - id: "09_003"
    type: "flashback"
    description_zh: "闪回：记得曾经的自己..."
    description_en: "Flashback: remembering her past self..."
    prompt: |
      Flashback to beginning of book, panicking researcher,
      contrast with current calm self,
      growth visualization,
      how far she's come.

  - id: "09_004"
    type: "theme"
    description_zh: "主题：提前拆除炸弹，而非最后抢救"
    description_en: "Theme: defuse bombs early, don't rescue at the end"
    prompt: |
      Split panel: bomb disposal expert vs firefighter,
      proactive vs reactive approaches,
      prevention better than cure visualization,
      core principle.

  # The Crisis Week (What Could Have Been) (panels 5-13)
  - id: "09_005"
    type: "scenario"
    description_zh: "假设场景：如果没学这些..."
    description_en: "Hypothetical: if she hadn't learned these..."
    prompt: |
      Dream sequence starting, "what if" scenario,
      alternative timeline where she didn't improve,
      warning visualization, ghost of past.

  - id: "09_006"
    type: "monday"
    description_zh: "周一危机：实验无法复现"
    description_en: "Monday crisis: experiment won't reproduce"
    prompt: |
      Monday morning shock, experiment results different,
      no record of original environment or config,
      panic setting in, reproducibility crisis.

  - id: "09_007"
    type: "tuesday"
    description_zh: "周二baseline问题：比较不公平"
    description_en: "Tuesday baseline problem: unfair comparison"
    prompt: |
      Discovering baseline comparison was flawed,
      different preprocessing, different seeds,
      fundamental validity questioned,
      evaluation crisis.

  - id: "09_008"
    type: "wednesday"
    description_zh: "周三消融缺失：审稿人会问为什么"
    description_en: "Wednesday ablation missing: reviewers will ask why"
    prompt: |
      Realizing no ablation study was done,
      can't explain which components matter,
      rushing to run ablations too late,
      analysis crisis.

  - id: "09_009"
    type: "thursday"
    description_zh: "周四数据丢失：找不到处理过的数据"
    description_en: "Thursday data missing: can't find processed data"
    prompt: |
      Researcher searching for data that was lost,
      no version control on data, no backup,
      data completely gone,
      data crisis.

  - id: "09_010"
    type: "friday"
    description_zh: "周五崩溃：一切都来不及了"
    description_en: "Friday collapse: everything is too late"
    prompt: |
      Complete breakdown, deadline tomorrow,
      everything broken, nothing fixable in time,
      despair and regret,
      worst case visualization.

  - id: "09_011"
    type: "wake"
    description_zh: "醒来！这只是假设场景"
    description_en: "Wake up! This was just a hypothetical"
    prompt: |
      Snapping back to reality from nightmare,
      relief washing over face,
      it was just a warning of what could have been,
      gratitude for preparedness.

  - id: "09_012"
    type: "contrast"
    description_zh: "现实中的小研：每一项都提前检查过"
    description_en: "Real Xiao Yan: every item checked in advance"
    prompt: |
      Real timeline showing proactive checks,
      each potential crisis addressed weeks ago,
      systematic prevention,
      preparedness in action.

  - id: "09_013"
    type: "principle"
    description_zh: "原则：截止日期只暴露问题，不产生问题"
    description_en: "Principle: deadline exposes problems, doesn't create them"
    prompt: |
      Visualization of deadline as spotlight,
      revealing problems that were always there,
      problems existed before, deadline just showed them,
      insight visualization.

  # The Prevention System (panels 14-21)
  - id: "09_014"
    type: "system"
    description_zh: "预防系统：每周自查"
    description_en: "Prevention system: weekly self-check"
    prompt: |
      Weekly ritual of self-checking,
      systematic review of all potential issues,
      calm preventive maintenance,
      sustainable practice.

  - id: "09_015"
    type: "check"
    description_zh: "检查1：复现性验证"
    description_en: "Check 1: reproducibility verification"
    prompt: |
      Weekly reproducibility check,
      running key experiments to verify they still work,
      catching drift early,
      reproducibility maintenance.

  - id: "09_016"
    type: "check"
    description_zh: "检查2：baseline公平性"
    description_en: "Check 2: baseline fairness"
    prompt: |
      Reviewing baseline comparison setup,
      ensuring apples-to-apples comparison,
      fairness validation,
      evaluation integrity.

  - id: "09_017"
    type: "check"
    description_zh: "检查3：消融实验状态"
    description_en: "Check 3: ablation study status"
    prompt: |
      Tracking ablation study progress,
      ensuring all important ablations planned,
      understanding component contributions,
      analysis completeness.

  - id: "09_018"
    type: "check"
    description_zh: "检查4：数据和环境备份"
    description_en: "Check 4: data and environment backup"
    prompt: |
      Verifying data backups and environment snapshots,
      everything recoverable if needed,
      safety net maintained,
      backup verification.

  - id: "09_019"
    type: "check"
    description_zh: "检查5：论文写作进度"
    description_en: "Check 5: paper writing progress"
    prompt: |
      Paper writing progress tracking,
      draft sections completed early,
      not leaving writing to last minute,
      writing progress maintenance.

  - id: "09_020"
    type: "timing"
    description_zh: "时机：离截止日越远，修复成本越低"
    description_en: "Timing: further from deadline, lower fix cost"
    prompt: |
      Graph showing fix cost vs time to deadline,
      exponential cost increase near deadline,
      early detection = cheap fixes,
      economic visualization.

  - id: "09_021"
    type: "mindset"
    description_zh: "心态：把每周当成小截止日"
    description_en: "Mindset: treat every week as mini-deadline"
    prompt: |
      Weekly milestones as checkpoints,
      continuous progress instead of last-minute rush,
      sustainable pace,
      healthy rhythm.

  # Victory (panels 22-25)
  - id: "09_022"
    type: "submission"
    description_zh: "提交日：从容地点击submit"
    description_en: "Submission day: calmly clicking submit"
    prompt: |
      Researcher calmly submitting paper,
      no last-minute panic, everything ready,
      confident click on submit button,
      peaceful submission.

  - id: "09_023"
    type: "celebration"
    description_zh: "庆祝：还有时间喝杯咖啡"
    description_en: "Celebration: still time for a coffee"
    prompt: |
      Researcher leaning back in chair with both hands behind head,
      steaming coffee cup on desk beside laptop,
      eyes closed with satisfied smile, stretching and relaxing,
      sunlight streaming through window, peaceful afternoon,
      plenty of time to spare, no rush, earned rest.

  - id: "09_024"
    type: "action"
    description_zh: "10分钟行动：设置每周自查提醒"
    description_en: "10-minute action: set up weekly self-check reminder"
    prompt: |
      Researcher setting up calendar reminder,
      "Weekly research check" recurring event,
      automation of good habits,
      system building.

  - id: "09_025"
    type: "preview"
    description_zh: "下一章预告：团队协作"
    description_en: "Next chapter preview: team collaboration"
    prompt: |
      Preview of team working together,
      multiple researchers coordinating,
      team dynamics about to be explored,
      collaboration visualization.
