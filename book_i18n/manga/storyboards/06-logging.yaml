# 第六章「记录的艺术」分镜脚本
chapter: "06-logging"
title_zh: "记录的艺术"
title_en: "The Art of Logging"

panels:
  - id: "06_001"
    description_zh: "学会了前面的技巧后，小研的项目逐渐步入正轨。但这天，她遇到了一个诡异的bug。程序明明运行了，但执行到哪一步了？数据从哪来的？面对满屏的print输出，她突然意识到：自己看不懂自己的日志。"
  - id: "06_002"
    description_zh: "她想起几周前，为了调试方便，到处加print语句。当时觉得很简单：'能看到输出不就行了吗？'现在想想，那时的自己太天真了。"
  - id: "06_003"
    description_zh: "数千行日志混在一起，有的是调试信息，有的是错误，有的根本不知道是什么。小研盯着屏幕，感到一阵眩晕。她需要的信息，就像埋在沙子里的针。"
  - id: "06_004"
    description_zh: "导师展示结构化日志的概念：每条日志都有清晰的级别、时间戳和上下文信息。"
  - id: "06_005"
    description_zh: "小研开始重构日志系统，使用统一的logging框架。"
  - id: "06_006"
    description_zh: "添加日志级别：DEBUG、INFO、WARNING、ERROR、CRITICAL，像交通信号灯一样清晰。"
  - id: "06_007"
    description_zh: "为每个实验添加唯一ID，方便追踪整个实验流程。"
  - id: "06_008"
    description_zh: "记录关键参数和决策点，就像科学实验的实验记录本。"
  - id: "06_009"
    description_zh: "配置日志输出：控制台显示重要信息，文件保存详细记录。"
  - id: "06_010"
    description_zh: "添加性能监控日志，记录每个步骤的耗时。"
  - id: "06_011"
    description_zh: "使用结构化格式（JSON）使日志易于解析和分析。"
  - id: "06_012"
    description_zh: "集成异常追踪：自动记录错误堆栈和上下文。"
  - id: "06_013"
    description_zh: "实现日志轮转：避免日志文件无限增长。"
  - id: "06_014"
    description_zh: "添加过滤器：敏感信息自动脱敏。"
  - id: "06_015"
    description_zh: "创建日志分析脚本：快速统计和可视化。"
  - id: "06_016"
    description_zh: "设置告警规则：关键错误立即通知。"
  - id: "06_017"
    description_zh: "三个月后，小研轻松定位到一个复杂的并发问题，多亏了详细的日志。"
  - id: "06_018"
    description_zh: "导师赞许地点头：'好的日志系统是研究的第二双眼睛。'"
  - id: "06_019"
    description_zh: "小研分享经验：'记录不仅是为了调试，更是为了理解和证明。'"
  - id: "06_020"
    description_zh: "结尾：小研的笔记本上写着：'Log everything that matters, nothing that doesn't.'"
