# 第四章「Git侦探」分镜脚本
# Chapter 4: "Git Detective"
# 25 panels on using Git as evidence and proof

chapter: "04-git-proof"
title_zh: "Git侦探"
title_en: "Git Detective"
title_ja: "Git探偵"

style_base: |
  Japanese manga illustration, clean anime art style,
  young Asian female researcher protagonist (casual clothes or lab coat, glasses optional),
  expressive anime eyes, dynamic composition, professional digital art,
  cel-shading, cinematic lighting, no text or speech bubbles.

panels:
  # Opening: The Reviewer Crisis (panels 1-5)
  - id: "04_001"
    type: "establishing"
    description_zh: "邮件的标题就像法庭的判决书。'Reviewer Concern: Please provide timestamped evidence that experiments were conducted before accessing test data'——小研看着这一行字，整个世界仿佛变成了黑白。审稿人在质疑她的诚实。三年的辛苦工作、那些不眠的夜晚、所有的理论验证...会不会在这一个问号面前全部化为虚无？"
    description_en: "Receiving reviewer email demanding experiment timeline proof"
    prompt: |
      Researcher reading email on screen with deep worry,
      face illuminated by harsh screen light, email showing reviewer skepticism,
      "Please provide evidence that experiments were conducted before seeing test data",
      hand trembling slightly, inner turmoil visible, serious accusation.

  - id: "04_002"
    type: "crisis"
    description_zh: "她一遍遍重复着：'我确实做了啊!'但声音越来越虚弱。脑子里闪过的全是问题：我有什么能拿出来证明？哪份笔记本记得最清楚？实验日志...那些混乱的日期和参数记录还在吗？更可怕的是，她意识到：没人要求她提前保存证据。现在，所有的诚实都没有了见证。"
    description_en: "Panic: how do I prove it?"
    prompt: |
      Researcher in distress, hands gripping head,
      thought bubbles showing fear and self-doubt,
      "I did it, but how do I prove it?" repeating in mind,
      desperate searching through papers and memories,
      anxiety overwhelming, feeling of helplessness.

  - id: "04_003"
    type: "revelation"
    description_zh: "绝望的那一刻，小研的眼睛突然落在桌子旁的屏幕上——Git。那些提交。那些她一直在做的、带着时间戳的提交。她整个身体一下子僵住了，然后缓缓坐直。我...我一直在做记录。每一个改动都有时间戳。每一个提交都有作者署名。每一行代码改动都被记录下来了。\"我有证据，\"她轻轻地说，\"一直都有。\""
    description_en: "Suddenly remembers: Git has all the records!"
    prompt: |
      Light bulb moment with dramatic visual impact,
      researcher's expression transforming from despair to realization,
      Git repository icon glowing in mind's eye,
      light dawning, hope suddenly ignited,
      sitting upright with newfound determination.

  - id: "04_004"
    type: "action"
    description_zh: "她打开终端，敲下 git log。屏幕上密密麻麻的提交记录开始滚动。小研的眼睛追随着每一行：Jan 15——'Add initial data exploration script'，Jan 22——'Fix data outlier detection'，Feb 3——'Implement baseline model'...整个三个月的研究旅程，就在这里，精确到每一次改动。每一个时间戳都在说：这不是编造，这不是事后诸葛亮。这是真实发生过的。"
    description_en: "Opening git log, searching for evidence"
    prompt: |
      Researcher as detective discovering case files,
      git log output filling screen with commit history,
      magnifying glass examining timestamps closely,
      scrolling through records with increasing excitement,
      investigative focus intensifying.

  - id: "04_005"
    type: "victory"
    description_zh: "泪水模糊了小研的眼睛，但这一次是解脱的泪水。她看着这整条时间线——每一次提交都有明确的日期、作者名字、哈希值，还有清晰的提交信息。之前那些她觉得繁琐的规范——按日期组织工作、写清楚提交信息、保持规律的提交节奏——现在闪闪发光，像是为这一刻专门准备的证据。'我不仅诚实做了这个研究。我还有专业的记录证明我做了。审稿人会看到的。'"
    description_en: "Found it! Timestamped commit records"
    prompt: |
      Triumphant researcher pointing at git log with confidence,
      commit timeline clearly visible on screen showing chronological proof,
      timestamps and hashes forming unquestionable evidence chain,
      relief and pride simultaneously washing over face,
      case solved, evidence gathered.

  # Git as Legal Record (panels 6-10)
  - id: "04_006"
    type: "concept"
    description_zh: "小研现在才真正理解：Git提交就是法律证据。每一个commit都是时光机里的快照，带着不可篡改的时间戳和作者签名。这不仅仅是代码记录，这是诚实的护盾。'如果有人质疑我，Git会替我说话。'"
    description_en: "Git commits = legal evidence"
    prompt: |
      Git commits visualized as legal documents with official stamps,
      timestamps as official seals, cryptographic hashes as signatures,
      courtroom metaphor showing commits as evidence,
      researcher understanding commits as immutable proof.

  - id: "04_007"
    type: "explanation"
    description_zh: "每一个提交，就像一份完整的法庭记录。哈希值是指纹，独一无二；时间戳是时间证明，不可抵赖；作者字段说明是谁做的；而提交信息——那必须清晰、必须有意义。小研看着屏幕上的git show输出，突然意识到：'我一直在无意中制造完美的证据链。'"
    description_en: "Components of each commit"
    prompt: |
      Anatomy of a git commit displayed with detailed annotations,
      hash as fingerprint, author identity, precise timestamp, message clarity, full diff,
      each component explained with visual connections,
      researcher discovering the power of each element.

  - id: "04_008"
    type: "warning"
    description_zh: "但小研也意识到：证据的力量也是双刃剑。如果你试图修改历史，git reflog会记下一切。如果你篡改时间戳或提交内容，哈希值会完全改变，明眼人一眼就看穿。'所以诚实不仅是道德的选择，也是最聪明的策略。'"
    description_en: "Warning: later modifications leave traces"
    prompt: |
      Forensic visualization of git history tampering attempts,
      rebase and force-push showing broken evidence chain,
      detective discovering suspicious changes through reflog,
      hash mismatches revealing dishonest modifications,
      warning: don't mess with git history.

  - id: "04_009"
    type: "best_practice"
    description_zh: "回顾自己的提交历史，小研发现了一个关键区别：有的人把三个月的工作压成一个巨大的commit，'fixed everything'；有的人每天都有好几个精心描述的小提交。前者？完全是雾里看花。后者？这才是清晰的故事。'我要成为后者。'"
    description_en: "Best practice: frequent small commits"
    prompt: |
      Visual comparison showing two commit strategies,
      left: one giant blob labeled "fixed stuff", confusing and unclear,
      right: series of small commits with clear messages, logical progression,
      researcher choosing clarity and accountability through small commits.

  - id: "04_010"
    type: "example"
    description_zh: "小研开始学会写清晰的提交信息。不是\"bug fix\"，而是\"Fix data preprocessing: remove outliers >3σ\"。不是\"update\"，而是\"Add baseline LSTM model with 84.2% validation accuracy\"。每条信息都像是一句日记，告诉未来的读者（也可能是审稿人）：\"这一步，我在做什么，为什么做。\""
    description_en: "Example of good commit messages"
    prompt: |
      Terminal showing excellent commit messages in git log,
      "Add baseline LSTM model with 84.2% validation accuracy",
      "Fix data preprocessing: remove outliers beyond 3 standard deviations",
      "Implement cross-validation with k=5 for robustness",
      clear narrative of research progress, self-documenting history.

  # Branch Strategy (panels 11-15)
  - id: "04_011"
    type: "concept"
    description_zh: "再然后，小研理解了分支的妙处。分支就像研究中的平行宇宙——在main分支（现实）之外，你可以在exp/experiment-A中疯狂尝试，在fix/data-bug中修复问题，每一个分支都是独立的故事线，互不干扰。\"我可以自由探索，同时保持安全。\""
    description_en: "Branch strategy: parallel universes of research"
    prompt: |
      Beautiful visualization of git branches as parallel universes,
      main as stable trunk branching into feature branches,
      multiple experimental timelines existing simultaneously,
      elegant interactive branch diagram, researcher standing at center.

  - id: "04_012"
    type: "practice"
    description_zh: "Main分支是神圣的。只有完全验证过、测试通过、审查无误的代码才能进入。这是稳定性的堡垒，是论文提交时的安心所在。小研给自己定了规则：绝不在main上直接编码，绝不直接推送未审查的改动。\"这就是专业。\""
    description_en: "main branch: only verified code"
    prompt: |
      Main branch as fortress with quality checkpoints,
      guardian figure reviewing each merge request,
      only polished, tested code allowed entry,
      stability and reliability protected at all costs.

  - id: "04_013"
    type: "practice"
    description_zh: "但实验分支？那是自由之地。小研在exp/attention-mechanism上大胆尝试，在feature/data-augmentation上疯狂实验，失败了也不怕——这些分支可以随意重写、随意删除，因为它们从未承诺过什么。\"这样我既能保护稳定的结果，也能自由探索。\""
    description_en: "Experiment branches: free exploration"
    prompt: |
      Experiment branches as playground laboratories,
      wild creative experimentation allowed freely,
      researcher coding with joy and abandon,
      safe isolation from main branch, freedom to fail.

  - id: "04_014"
    type: "workflow"
    description_zh: "完整的工作流开始变得清晰：从main拉一个新分支→在这个分支上开发→写提交信息→本地测试→创建pull request→等待审查→修改反馈→最后合并回main。每一步都是有意义的，每一步都为了保证这个主线的纯净。小研感觉自己不再是一个人在编码，而是在参与一个有纪律的、有见证的过程。"
    description_en: "Workflow: branch → test → merge"
    prompt: |
      Git workflow cycle shown as continuous improvement loop,
      create feature branch, develop, commit, test locally,
      create pull request, code review, address feedback,
      merge to main with confidence,
      professional sustainable development practice.

  - id: "04_015"
    type: "tip"
    description_zh: "小研甚至开始用分支名来记录意图。\"exp/transformer-with-attention\" \"fix/nan-in-loss-calculation\" \"feature/cross-validation-v2\"——仅仅看分支名，任何人都能猜到这个分支在做什么。\"这就是自文档化。审稿人如果想理解我的思路，分支名就是第一个线索。\""
    description_en: "Tip: use branch names to record purpose"
    prompt: |
      Branch naming convention showing clear purpose semantics,
      "exp/transformer-baseline" "fix/data-normalization-bug"
      "feature/attention-mechanism" "refactor/simplify-dataloader",
      each name self-documenting the branch's purpose,
      researcher building clear communication into infrastructure.

  # Tags as Milestones (panels 16-19)
  - id: "04_016"
    type: "concept"
    description_zh: "然后是标签。标签就像在时间线上竖起的金色里程碑。\"submission-2024-01-15\"「论文投稿时的代码版本」\"best-model-92.5\"「目前最佳模型」——这些标签记录关键时刻，让小研可以瞬间返回到任何重要时刻。\"时间机器的精确指针。\""
    description_en: "Git tags: important milestones"
    prompt: |
      Git tags visualized as golden milestone markers planted in time,
      "v1.0-paper-submission" "best-model-checkpoint" floating above timeline,
      researcher placing markers at significant research moments,
      permanent achievement records marked with pride.

  - id: "04_017"
    type: "use_case"
    description_zh: "小研给论文投稿的代码打了标签：v1.0-submission-20240115。一周后审稿意见来了，要求复现某个结果。小研只需一行命令：git checkout v1.0-submission-20240115，立刻回到投稿时的精确状态。\"没有猜测，没有不确定。就是这个版本。\""
    description_en: "Use case: tagging paper submission version"
    prompt: |
      Researcher creating and documenting submission tag,
      "submission-2024-01-15" tag being marked with timestamp,
      peace of mind knowing exact version was saved forever,
      reference point established for all future inquiries.

  - id: "04_018"
    type: "use_case"
    description_zh: "她还标记了训练过程中的最佳模型：best-val-acc-94.7。这个标签不仅记录了成就，也是一个安全点。如果后续的改进反而降低了准确率，她可以随时回到这个已知的最佳状态，而不是在众多试验中迷失。\"每一个进度，都被记住了。\""
    description_en: "Use case: tagging best model"
    prompt: |
      Researcher tagging best performing model with metrics,
      "best-val-accuracy-94.7-epoch-47" tag visible on screen,
      easy checkout to this exact high-performing state,
      checkpoint saved permanently, safe reference point.

  - id: "04_019"
    type: "benefit"
    description_zh: "最妙的是：当审稿人说\"我想看你最终提交时的那个模型\",小研可以直接回复\"我给你checkout命令，你可以得到完全一样的代码和模型。\"不是说\"我印象中……\",而是\"这正是那个版本。\"这种自信和精准，会让审稿人从怀疑变成信任。"
    description_en: "Benefit: instant response to reviewer requests"
    prompt: |
      Researcher confidently responding to reviewer with tag reference,
      terminal showing exact checkout command for tagged version,
      code and models fully reproducible, professional expertise evident,
      reviewer impressed by precision and readiness.

  # Common Mistakes (panels 20-22)
  - id: "04_020"
    type: "mistake"
    description_zh: "小研看到师姐的仓库里有一个著名的提交：'Fixed everything'（1247 files changed）。三个月的工作一次性提交，提交信息就四个字。多久后，当师姐需要回顾'到底什么时候改了数据预处理'时，她只能打开这个巨型commit，在1200多个改动里面面相觑。'这就是为什么我现在每天都有好几个小提交，'小研对自己说。"
    prompt: |
      Giant commit blob labeled "fixed stuff",
      researcher confused trying to find specific change,
      useless commit message, lost in changes,
      bad practice example.

  - id: "04_021"
    type: "mistake"
    description_zh: "同学阿明有过一次惨痛的经历。他花了一周调整模型参数，终于得到94%的准确率。他在本地跑了验证，看着结果欣喜若狂。但他没有提交。几天后，电脑出问题，重装系统。那个94%的模型...没了。他抱着电脑大哭。从此，他理解了一个真理：'没有commit的工作，在电脑看来就是不存在。'小研听完这个故事，下定决心：每个有价值的改动，必须立刻提交。"
    prompt: |
      Researcher realizing code was never committed,
      good results but no proof it existed then,
      regret expression, lost evidence,
      hard lesson learned.

  - id: "04_022"
    type: "mistake"
    description_zh: "有一次，小研差点犯一个要命的错误。她写了一个包含API密钥和数据库密码的config.py，一不小心就要git add。幸亏导师提醒了她。Git一旦提交，即使你删除了文件，历史里也永远留着。任何有权限访问仓库的人都能翻出那些密钥。小研立刻学会了创建.gitignore文件，把所有敏感信息都屏蔽掉。'诚实透明是好事，但保护好自己的密钥，才是基本的安全。'"
    prompt: |
      Horror of discovering API keys in commit history,
      security warning, password exposed in public repo,
      immediate panic, .gitignore lesson learned.

  # Closing (panels 23-25)
  - id: "04_023"
    type: "summary"
    description_zh: "小研把电脑关掉，走到窗边。那封质疑她诚实的邮件，现在变成了她最有力的证据。她意识到一个深刻的转变：以前，她害怕被质疑，因为她没有证据。现在，她有了Git。它不会撒谎。它不会遗忘。每一个时间戳、每一个改动、每一条提交信息——都在那里，不可篡改，不可否认。'Git，'她喃喃自语，'就像是我这个研究者最好的律师。'"
    prompt: |
      Git personified as friendly lawyer defending researcher,
      holding folder of commit evidence,
      "I have records of everything you did",
      protection and trust.

  - id: "04_024"
    type: "action"
    description_zh: "她决定立刻采取行动。打开git log，审视自己最近一周的提交。提交信息清晰吗？改动大小合理吗？频次是否规律？她发现了几个可以改进的地方——有一次commit改了太多文件，有一次信息写得不够明确。'从现在开始，'她对自己说，'我会像写论文一样认真对待每一个commit。这不仅是为了我自己的工作流，也是为了未来可能需要审查我的工作的人。'"
    prompt: |
      Researcher reviewing own recent commits,
      checklist: clear messages? small changes? regular frequency?
      quick audit, improvement opportunity identified.

  - id: "04_025"
    type: "preview"
    description_zh: "但小研突然想到一个新的问题。有了Git的完美记录，我就能说我的工作'完成'了吗？什么时刻，我才能真正地、自信地提交代码、提交论文，说'这就是最终版本'？答案在于一个看似简单但往往被忽视的东西：完成的定义。下一章，小研要学的是，如何清晰地定义'什么叫完成'，这样才不会陷入永无止境的改进中。"
    prompt: |
      Preview of checklist with quality gates,
      "When is something truly done?" question floating,
      completion criteria visualization,
      standards about to be set.
