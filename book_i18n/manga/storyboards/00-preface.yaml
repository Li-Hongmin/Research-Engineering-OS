# 序章「截止日前3天」分镜脚本
# Prologue: "3 Days Before Deadline"

chapter: "00-preface"
title_zh: "截止日前3天"
title_en: "3 Days Before Deadline"
title_ja: "締切3日前"

style_base: |
  Japanese manga illustration, clean anime art style,
  young Asian female researcher protagonist (casual clothes or lab coat, glasses optional),
  expressive anime eyes, dynamic composition, professional digital art,
  cel-shading, cinematic lighting, no text or speech bubbles.

panels:
  - id: "00_001"
    type: "establishing"
    description_zh: "又是一个deadline的前夜。小研瘫坐在电脑前，屏幕上跳出来的红色报错信息就像死亡通知单。她揉了揉酸涩的眼睛，看着桌上堆积成山的空咖啡杯和拆散的便利贴，心想：为什么每次都要到这最后一刻？"

  - id: "00_002"
    type: "closeup"
    description_zh: "她点击运行按钮，等待的那三十秒像是三十分钟。结果一出来，小研的手就冰了。同一个实验，上周还是完美的结果，今天重跑出来的数据完全不同。她反复检查了代码——没改过啊。为什么？这是怎么回事？"

  - id: "00_003"
    type: "action"
    description_zh: "小研开始疯狂地翻找之前的版本。final、final_v2、final_REAL、backup_old...她点了一个，又点另一个，屏幕上闪过各种奇怪的文件夹名字。她突然僵住了：我根本不知道当时用的是哪一个。她甚至不确定，自己到底改没改过代码。"

  - id: "00_004"
    type: "flashback"
    description_zh: "三周前，当实验第一次成功时，小研兴奋得跳了起来。当时她只想着怎么快速往前推进——反正结果对就行，其他细节以后再说。她甚至没想起来做任何记录。现在回想起来，那时的自己为什么这么自信呢？为什么就这么肯定，日后不会忘记怎么做的？"

  - id: "00_005"
    type: "transition"
    description_zh: "小研把两份打印稿并排放在桌上。左边是三周前的完美结果，右边是今晚的失败。她盯着这两张纸，试图找到线索。环境不同了吗？参数改了吗？还是...她突然意识到最可怕的事实：她根本不知道三周前用的是什么配置、什么随机种子、什么环境。"

  - id: "00_006"
    type: "dramatic"
    description_zh: "就在这时，黑暗的角落开始蠕动。三个巨大的身影从阴影中浮现——纠缠的代码和TODO注释（探索债），破碎的测试器材和缺失的验证（验证债），散落的配置文件和版本混乱（复现债）。小研看着它们缓缓显现，突然明白了：这些...全是我自己埋下的雷。"

  - id: "00_007"
    type: "action"
    description_zh: "第一只怪兽冲了上来——混乱的代码、快速hack、漫天的TODO注释像子弹一样射来。小研挥舞着手臂，却怎么也躲不掉。她听到自己的声音在回响：'我当时为什么不写清楚？为什么只想着快速推进？'"

  - id: "00_008"
    type: "action"
    description_zh: "第二只怪兽从左边逼近——不完整的测试、缺失的验证、被跳过的对照实验。紫色的雾气包围了小研，她窒息般地呼吸着。'我怎么就没想到要多验证几次呢？我怎么就相信了一次成功？'"

  - id: "00_009"
    type: "action"
    description_zh: "第三只怪兽从右边缠绕而来——散落的配置文件、版本冲突、丢失的dependencies就像锁链一样束缚着小研。'requirements.txt在哪来着？Python版本是多少？随机种子是几？'无数的问号在脑子里转圈。她拼命挣扎，但每挣扎一下，锁链就紧一分。"

  - id: "00_010"
    type: "climax"
    description_zh: "三只怪兽最终合围。小研跪倒在地，被探索债、验证债、复现债的无形巨手压得动弹不得。72小时。她抬起头看向电脑——还是那些闪烁的红色报错。她的眼神空洞而绝望。一时的快速推进，现在变成了永恒的困境。她想不出办法了。"

  - id: "00_011"
    type: "turning_point"
    description_zh: "就在绝望要吞没她的那一刻，实验室的门被轻轻推开。一道光线射进来，怪兽们开始尖叫着后退。小研抬起头——导师站在门口，手里拿着一本发光的书。导师平静地说：'我想，你需要了解一件事。关于如何把这些问题系统地解决掉。'"

  - id: "00_012"
    type: "reveal"
    description_zh: "导师递出一本书。《研究工程OS》——散发着温暖的金色光芒。小研看着这本书，有点不敢相信：这真的能解决我现在的问题吗？导师说：'这里面是我从事研究这些年来学到的东西。关于如何避免像你现在这样的困境。'"

  - id: "00_013"
    type: "acceptance"
    description_zh: "小研伸出颤抖的双手接住这本书。温暖的金光照亮她的脸庞。眼中的绝望开始褪去，取而代之的是一丝微弱的希望。身后的三只怪兽开始尖叫着后退——仿佛被这束光驱赶一样。也许...也许还有办法。"

  - id: "00_014"
    type: "revelation"
    description_zh: "小研颤抖地翻开书的第一页。章节标题在金光中闪烁升起——'三种债务'、'实验作为单位'、'仓库结构'、'Git证明'...每一个标题都击中了她此刻最困扰的问题。她突然意识到：这不只是工程技巧，这是一个完整的系统。"

  - id: "00_015"
    type: "ending"
    description_zh: "天亮了。小研站在窗前，紧紧抱着《研究工程OS》。朝阳照在她的脸上，昨晚的疲惫还在，但眼神已经不同了。她重新坐在电脑前，打开了书的第一章。'好，让我们从最基础的开始。三种债务...我现在就要明白这个。'72小时还有时间。这一次，她知道该怎么做了。"
