[book]
title = "Research Engineering OS"
description = "把返工压缩成规范 + 模板 + 检查清单"
authors = ["Li Hongmin (李鸿敏)"]
language = "zh"
src = "src"

[build]
build-dir = "book"
create-missing = true

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/your-username/research-engineering-os"
edit-url-template = "https://github.com/your-username/research-engineering-os/edit/main/mdbook/{path}"
site-url = "/research-engineering-os/"
cname = ""  # 如需自定义域名，填入此处
additional-css = ["theme/custom.css"]

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true

[output.html.fold]
enable = false
level = 0

[output.html.print]
enable = true

[output.html.playground]
editable = false
copyable = true
copy-js = true

[output.pdf]
# mdbook-pdf 配置（需要安装 mdbook-pdf 插件）
# 安装：cargo install mdbook-pdf
optional = true
